<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul Olinger Ost — Directeur de la Photographie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="construction-badge"><span class="dot"></span>Site en construction</div>
  <nav>
    <button id="navFilmo">Filmographie</button>
    <button id="navPics">Pics</button>
    <button id="navBio">Bio</button>
  </nav>
</header>

<section class="hero">
  <div class="hero-bg" id="heroBg">
    <!-- Remplacez la source ci-dessous par la vidéo que vous m'enverrez -->
    <video class="hero-video" id="heroVideo" autoplay muted loop playsinline>
      <source src="assets/hero-video.mp4" type="video/mp4">
    </video>
  </div>
  <div class="hero-scrim"></div>
  <div class="hero-content">
    <h1 class="display">Paul Olinger Ost</h1>
    <p class="role">Directeur de la Photographie / Cinematographer</p>
    <p class="role-travel">Paris based but worldwild traveller</p>
  </div>
</section>

<main>
  <div class="project-list" id="projectList"></div>
</main>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Fermer">✕</button>
  <button class="lb-prev" id="lbPrev" aria-label="Précédent">←</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-next" id="lbNext" aria-label="Suivant">→</button>
  <p class="lb-caption" id="lbCaption"></p>
</div>

<div class="text-modal" id="filmoModal">
  <button class="modal-close" id="filmoClose" aria-label="Fermer">✕</button>
  <div class="text-modal-inner">
    <h2 class="display">Filmographie</h2>
    <div class="modal-body" id="filmoBody"></div>
  </div>
</div>

<div class="text-modal" id="picsModal">
  <button class="modal-close" id="picsClose" aria-label="Fermer">✕</button>
  <div class="text-modal-inner">
    <h2 class="display">Pics</h2>
    <div class="pics-grid" id="picsGrid"></div>
  </div>
</div>

<div class="text-modal" id="bioModal">
  <button class="modal-close" id="bioClose" aria-label="Fermer">✕</button>
  <div class="text-modal-inner">
    <h2 class="display">Bio</h2>
    <div class="modal-body" id="bioBody"></div>
  </div>
</div>

<footer id="contact">
  <div class="col">
    <h3 class="display">Contact</h3>
    <p><a href="mailto:contact@paulolinger.com">contact@paulolinger.com</a></p>
    <p>06.59.86.26.80</p>
    <p>Paris, France</p>
  </div>
  <div class="col">
    <h3 class="display">Suivre</h3>
    <p><a href="https://www.instagram.com/paulolingerost/" target="_blank" rel="noopener">Instagram</a></p>
    <p><a href="https://www.imdb.com/name/nm7436555/" target="_blank" rel="noopener">IMDb</a></p>
  </div>
  <div class="col">
    <p>© Paul Olinger Ost</p>
  </div>
</footer>

<script src="script.js"></script>

</body>
</html>
