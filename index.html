<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul Olinger Ost — Directeur de la Photographie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121110;
    --bg-alt:#17150f;
    --ink:#EDE7DA;
    --ink-dim:#948C7E;
    --line: rgba(237,231,218,0.14);
    --accent:#A9784B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-weight:400;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  img{display:block; max-width:100%;}
  button{font-family:inherit;}

  .display{font-family:'Fraunces', serif; font-weight:400;}

  /* ---------- top bar ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 5vw;
    background:linear-gradient(to bottom, rgba(18,17,16,0.95), rgba(18,17,16,0));
  }
  header .name{
    font-size:0.85rem;
    letter-spacing:0.02em;
    background:none; border:none; padding:0; margin:0; cursor:pointer; color:inherit;
    font-family:'Fraunces', serif; font-weight:400;
    transition:color .2s ease;
  }
  header .name:hover, header .name:focus-visible{color:var(--accent);}
  nav{display:flex; gap:28px;}
  nav button{
    font-size:0.85rem;
    color:var(--ink-dim);
    background:none; border:none; cursor:pointer;
    border-bottom:1px solid transparent;
    padding-bottom:2px;
    transition:color .2s ease, border-color .2s ease;
  }
  nav button:hover, nav button:focus-visible{color:var(--ink); border-color:var(--accent);}

  /* ---------- hero ---------- */
  .hero{
    height:clamp(460px, 68vw, 100vh);
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    position:relative;
    padding:0 5vw 64px;
    background:#000;
    overflow:hidden;
  }
  .hero-video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:0.55;
  }
  .hero-scrim{
    position:absolute; inset:0;
    background:linear-gradient(to top, var(--bg) 4%, rgba(18,17,16,0.15) 55%, rgba(18,17,16,0.55) 100%);
  }
  .hero-content{position:relative; max-width:1100px;}
  .hero-content h1{
    font-size:clamp(2.2rem, 6.4vw, 5.4rem);
    line-height:1;
    font-weight:400;
    letter-spacing:-0.01em;
    white-space:nowrap;
  }
  .hero-content .role{
    margin-top:22px;
    font-size:clamp(0.95rem, 1.6vw, 1.1rem);
    color:var(--ink-dim);
    letter-spacing:0.01em;
  }
  .hero-content .role-travel{
    margin-top:10px;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:300;
    font-size:clamp(1rem, 1.8vw, 1.2rem);
    color:var(--ink);
  }

  @media (max-width:640px){
    .hero{padding:0 8vw 90px;}
    .hero-content{text-align:center; margin:0 auto;}
    .hero-content h1{white-space:normal;}
  }

  /* ---------- projects list ---------- */
  .projects-container{
    padding:60px 5vw;
    display:flex;
    flex-direction:column;
    gap:70px;
  }
  .project-row{
    display:grid;
    grid-template-columns:minmax(220px, 300px) 1fr;
    gap:40px;
    border-bottom:1px solid var(--line);
    padding-bottom:50px;
  }
  .project-row:last-child{
    border-bottom:none;
    padding-bottom:0;
  }
  .project-meta h2{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-size:1.8rem;
    line-height:1.2;
    margin-bottom:8px;
  }
  .project-meta .type{
    font-style:italic;
    color:var(--ink-dim);
    font-size:0.9rem;
    margin-bottom:16px;
  }
  .project-meta .credit{
    font-size:0.88rem;
    color:var(--ink-dim);
    margin-bottom:6px;
  }
  .project-meta .credit strong{color:var(--ink); font-weight:500;}
  .project-meta .diffusion{
    margin-top:14px;
    font-size:0.82rem;
    color:var(--ink-dim);
    font-style:italic;
  }

  .project-stills{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:12px;
  }
  .project-stills button{
    border:none; padding:0; margin:0; background:#000; cursor:pointer;
    position:relative; overflow:hidden;
    aspect-ratio:16/9;
  }
  .project-stills img{
    width:100%; height:100%; object-fit:cover;
    transition:transform .5s ease, filter .5s ease;
    filter:grayscale(0.1) brightness(0.92);
  }
  .project-stills button:hover img{
    transform:scale(1.035);
    filter:grayscale(0) brightness(1);
  }

  @media (max-width:820px){
    .project-row{grid-template-columns:1fr; gap:24px;}
    .project-stills{grid-template-columns:repeat(3, 1fr);}
    header{padding:18px 6vw;}
    nav{gap:18px;}
  }
  @media (max-width:540px){
    .project-stills{grid-template-columns:1fr;}
  }

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed; inset:0; z-index:100;
    background:rgba(10,9,8,0.97);
    display:flex;
    align-items:center; justify-content:center;
    flex-direction:column;
    padding:5vh 5vw;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .45s ease, visibility 0s linear .45s;
  }
  .lightbox.open{
    opacity:1; visibility:visible; pointer-events:auto;
    transition:opacity .45s ease, visibility 0s linear 0s;
  }
  .lightbox img{
    max-width:100%; max-height:76vh;
    object-fit:contain;
  }
  .lightbox .lb-caption{
    margin-top:20px; text-align:center;
    font-size:0.85rem; color:var(--ink-dim);
  }
  .lightbox .lb-caption strong{color:var(--ink); font-weight:500;}
  .lb-close, .lb-prev, .lb-next{
    position:absolute;
    background:none; border:none; color:var(--ink);
    font-family:'Inter', sans-serif; font-size:1.6rem;
    cursor:pointer; padding:14px;
    opacity:0.7; transition:opacity .2s ease;
  }
  .lb-close:hover, .lb-prev:hover, .lb-next:hover{opacity:1;}
  .lb-close{top:16px; right:20px; font-size:1.4rem;}
  .lb-prev{left:8px; top:50%; transform:translateY(-50%);}
  .lb-next{right:8px; top:50%; transform:translateY(-50%);}

  /* ---------- modals (Filmographie, Pics, Bio) ---------- */
  .text-modal{
    position:fixed; inset:0; z-index:100;
    background:rgba(10,9,8,0.97);
    display:flex;
    align-items:flex-start; justify-content:center;
    padding:12vh 6vw 8vh;
    overflow-y:auto;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .45s ease, visibility 0s linear .45s;
  }
  .text-modal.open{
    opacity:1; visibility:visible; pointer-events:auto;
    transition:opacity .45s ease, visibility 0s linear 0s;
  }
  .text-modal-inner{
    max-width:800px; width:100%;
    text-align:center;
  }
  .text-modal-inner h2{
    font-family:'Fraunces', serif; font-weight:400;
    font-size:clamp(1.6rem, 3.4vw, 2.4rem);
    margin-bottom:34px;
  }
  .text-modal-inner .modal-body{
    text-align:left;
    font-size:0.92rem;
    color:var(--ink-dim);
    line-height:1.75;
  }
  .text-modal-inner .modal-body p{margin-bottom:18px;}
  #bioModal .modal-body p{text-align:justify; text-indent:2em;}
  
  .bio-photo-wrapper{
    margin-top:40px;
    text-align:center;
  }
  .bio-photo-wrapper img{
    max-width:320px;
    width:100%;
    height:auto;
    border-radius:4px;
    margin:0 auto;
    filter:grayscale(0.15);
  }

  /* Pics Patchwork Grid */
  .pics-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:12px;
  }
  .pics-grid img{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    filter:grayscale(0.1);
    transition:filter .3s ease;
  }
  .pics-grid img:hover{
    filter:grayscale(0);
  }

  .text-modal-inner .modal-body h3{
    font-family:'Fraunces', serif; font-weight:400; color:var(--ink);
    font-size:1.05rem; letter-spacing:0.03em;
    margin:30px 0 14px;
  }
  .text-modal-inner .modal-body h3:first-child{margin-top:0;}
  .text-modal-inner .modal-body ul{list-style:none;}
  .text-modal-inner .modal-body li{margin-bottom:16px;}
  .text-modal-inner .modal-body li strong{color:var(--ink); font-weight:500;}
  .text-modal-inner .modal-body li span{
    display:block; font-style:italic; font-size:0.85rem; margin-top:2px;
  }

  .modal-close{
    position:absolute; top:16px; right:20px;
    background:none; border:none; color:var(--ink);
    font-size:1.4rem; cursor:pointer; padding:14px;
    opacity:0.7; transition:opacity .2s ease;
  }
  .modal-close:hover{opacity:1;}

  /* ---------- footer ---------- */
  footer{
    padding:70px 5vw 50px;
    border-top:1px solid var(--line);
    display:flex; flex-wrap:wrap; justify-content:space-between; gap:24px;
    font-size:0.85rem; color:var(--ink-dim);
  }
  footer a{color:var(--ink);}
  footer a:hover{color:var(--accent);}
  footer .col{min-width:200px;}
  footer .col h3{
    font-family:'Fraunces', serif; font-size:1.1rem; color:var(--ink); font-weight:400; margin-bottom:10px;
  }

  @media (max-width:640px){
    footer{
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:32px;
    }
    footer .col{min-width:0;}
    .pics-grid{grid-template-columns:repeat(2, 1fr);}
  }

  :focus-visible{outline:1px solid var(--accent); outline-offset:2px;}
</style>
</head>
<body>

<header>
  <div><button class="name" id="brandBtn">Paul Olinger Ost</button></div>
  <nav>
    <button id="navFilmo">FILMOGRAPHIE</button>
    <button id="navPics">PICS</button>
    <button id="navBio">BIO</button>
  </nav>
</header>

<section class="hero">
  <video class="hero-video" autoplay loop muted playsinline>
    <source src="URL_DE_TA_VIDEO.mp4" type="video/mp4">
  </video>
  <div class="hero-scrim"></div>
  <div class="hero-content">
    <h1 class="display">Paul Olinger Ost</h1>
    <p class="role">Directeur de la Photographie / Cinematographer</p>
    <p class="role-travel">Paris based but worldwide traveller</p>
  </div>
</section>

<main>
  <div class="projects-container" id="projectsContainer"></div>
</main>

<div class="lightbox" id="lightbox">

  <button class="lb-prev" id="lbPrev" aria-label="Précédent">←</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-next" id="lbNext" aria-label="Suivant">→</button>
  <p class="lb-caption" id="lbCaption"></p>
</div>

<div class="text-modal" id="filmoModal">
  <button class="modal-close" id="filmoClose" aria-label="Fermer">✕</button>
  <div class="text-modal-inner">
    <h2 class="display">Filmographie</h2>
    <div class="modal-body" id="filmoBody"></div>
  </div>
</div>

<div class="text-modal" id="picsModal">
  <button class="modal-close" id="picsClose" aria-label="Fermer">✕</button>
  <div class="text-modal-inner">
    <h2 class="display">Pics</h2>
    <div class="modal-body">
      <div class="pics-grid" id="picsGrid">
        </div>
    </div>
  </div>
</div>

<div class="text-modal" id="bioModal">
  <button class="modal-close" id="bioClose" aria-label="Fermer">✕</button>
  <div class="text-modal-inner">
    <h2 class="display">Bio</h2>
    <div class="modal-body" id="bioBody"></div>
  </div>
</div>

<footer id="contact">
  <div class="col">
    <h3 class="display">Contact</h3>
    <p><a href="mailto:contact@paulolinger.com">contact@paulolinger.com</a></p>
    <p>06.59.86.26.80</p>
    <p>Paris, France</p>
  </div>
  <div class="col">
    <h3 class="display">Suivre</h3>
    <p><a href="https://www.instagram.
