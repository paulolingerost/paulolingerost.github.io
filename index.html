<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul Olinger Ost — Directeur de la Photographie</title>
<meta name="description" content="Paul Olinger Ost, directeur de la photographie basé à Paris, disponible pour tournages à l'international.">
<meta property="og:title" content="Paul Olinger Ost — Directeur de la photographie">
<meta property="og:description" content="Paul Olinger Ost, directeur de la photographie basé à Paris, disponible pour tournages à l'international.">
<meta property="og:image" content="https://paulolingerost.com/assets/og-cover.jpg">
<meta property="og:url" content="https://paulolingerost.com/">
<meta name="twitter:card" content="summary_large_image">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="construction-badge">site en cours de finition</div>
  <nav>
    <button id="navFilmo">Filmographie</button>
    <button id="navPics">Photos</button>
    <button id="navBio">Bio</button>
  </nav>
</header>

<section class="hero">
  <div class="hero-bg" id="heroBg">
    <!-- La vidéo doit être un .mp4 encodé en H.264 (voir COMMENT_AJOUTER_LES_MEDIAS.md).
         Deux versions sont attendues : hero-1080.mp4 (grand écran) et
         hero-portrait.mp4 (téléphone, recadrée en 9:16). script.js choisit
         la bonne au chargement selon la largeur d'écran. -->
    <video class="hero-video" id="heroVideo" autoplay muted loop playsinline preload="metadata" poster="assets/hero-poster.jpg" data-src-desktop="assets/hero-1080.mp4" data-src-mobile="assets/hero-portrait.mp4">
    </video>
  </div>
  <div class="hero-scrim"></div>
  <div class="hero-bottom">
    <div class="hero-content">
      <h1 class="display">Paul Olinger Ost</h1>
      <p class="role">Directeur de la photographie</p>
      <p class="role-travel">Paris — disponible pour tournages à l'international</p>
    </div>
    <button class="hero-play" id="heroPlay" aria-label="Voir la bande démo avec le son">
      <span class="hero-play-icon">▶</span>
      <span class="hero-play-label">Voir la bande démo</span>
    </button>
  </div>
</section>

<main>
  <div class="project-list" id="projectList"></div>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo agrandie">
  <button class="lb-close" id="lbClose" aria-label="Fermer">✕</button>
  <button class="lb-prev" id="lbPrev" aria-label="Précédent">←</button>
  <img id="lbImg" alt="" hidden>
  <button class="lb-next" id="lbNext" aria-label="Suivant">→</button>
  <p class="lb-caption" id="lbCaption"></p>
</div>

<div class="video-modal" id="videoModal" role="dialog" aria-modal="true" aria-label="Bande démo">
  <button class="modal-close" id="videoModalClose" aria-label="Fermer">✕</button>
  <div class="video-embed" id="videoEmbed"></div>
</div>

<div class="text-modal" id="filmoModal" role="dialog" aria-modal="true" aria-label="Filmographie">
  <button class="modal-close" id="filmoClose" aria-label="Fermer">✕</button>
  <div class="text-modal-inner">
    <h2 class="display">Filmographie</h2>
    <div class="modal-body" id="filmoBody"></div>
  </div>
</div>

<div class="text-modal" id="picsModal" role="dialog" aria-modal="true" aria-label="Photos">
  <button class="modal-close" id="picsClose" aria-label="Fermer">✕</button>
  <div class="text-modal-inner">
    <h2 class="display">Photos</h2>
    <div class="pics-grid" id="picsGrid"></div>
  </div>
</div>

<div class="text-modal" id="bioModal" role="dialog" aria-modal="true" aria-label="Bio">
  <button class="modal-close" id="bioClose" aria-label="Fermer">✕</button>
  <div class="text-modal-inner">
    <h2 class="display">Bio</h2>
    <div class="modal-body" id="bioBody"></div>
  </div>
</div>

<footer id="contact">
  <div class="col">
    <h3 class="display">Contact</h3>
    <p><a href="mailto:contact@paulolingerost.com">contact@paulolingerost.com</a></p>
    <p><a href="tel:+33659862680">06 59 86 26 80</a></p>
    <p>Paris, France</p>
  </div>
  <div class="col">
    <h3 class="display">Suivre</h3>
    <p><a href="https://www.instagram.com/paulolingerost/" target="_blank" rel="noopener">Instagram</a></p>
    <p><a href="https://www.imdb.com/name/nm7436555/" target="_blank" rel="noopener">IMDb</a></p>
  </div>
  <div class="col">
    <p>© Paul Olinger Ost</p>
  </div>
</footer>

<script src="script.js"></script>

</body>
</html>
