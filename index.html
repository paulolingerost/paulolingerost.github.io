<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul Olinger Ost — Directeur de la Photographie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121110;
    --bg-alt:#17150f;
    --ink:#EDE7DA;
    --ink-dim:#948C7E;
    --line: rgba(237,231,218,0.14);
    --accent:#A9784B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-weight:400;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  img{display:block; max-width:100%;}
  button{font-family:inherit;}

  .display{font-family:'Fraunces', serif; font-weight:400;}

  /* ---------- top bar ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 5vw;
    background:linear-gradient(to bottom, rgba(18,17,16,0.9), rgba(18,17,16,0));
  }
  header .name{
    font-size:0.85rem;
    letter-spacing:0.02em;
    background:none; border:none; padding:0; margin:0; cursor:pointer; color:inherit;
    font-family:'Fraunces', serif; font-weight:400;
    transition:color .2s ease;
  }
  header .name:hover, header .name:focus-visible{color:var(--accent);}
  nav{display:flex; gap:28px;}
  nav a, nav button{
    font-size:0.85rem;
    color:var(--ink-dim);
    background:none; border:none; cursor:pointer;
    border-bottom:1px solid transparent;
    padding-bottom:2px;
    transition:color .2s ease, border-color .2s ease;
  }
  nav a:hover, nav a:focus-visible, nav button:hover{color:var(--ink); border-color:var(--accent);}

  /* ---------- hero ---------- */
  .hero{
    height:clamp(460px, 68vw, 100vh);
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    position:relative;
    padding:0 5vw 64px;
    background:#000;
    transition:opacity .45s ease;
  }
  .hero.fading{opacity:0;}
  .hero-bg{
    position:absolute; inset:0;
    opacity:0.55;
  }
  .hero-bg-layer{
    position:absolute; inset:0;
    background-size:cover;
    background-position:center 30%;
    opacity:0;
    transition:opacity 2.2s ease;
  }
  .hero-bg-layer.is-active{opacity:1;}
  .hero-scrim{
    position:absolute; inset:0;
    background:linear-gradient(to top, var(--bg) 4%, rgba(18,17,16,0.15) 55%, rgba(18,17,16,0.55) 100%);
  }
  .hero-content{position:relative; max-width:1100px;}
  .hero-content h1{
    font-size:clamp(2.2rem, 6.4vw, 5.4rem);
    line-height:1;
    font-weight:400;
    letter-spacing:-0.01em;
    white-space:nowrap;
  }
  .hero-content .role{
    margin-top:22px;
    font-size:clamp(0.95rem, 1.6vw, 1.1rem);
    color:var(--ink-dim);
    letter-spacing:0.01em;
  }
  .hero-content .role-travel{
    margin-top:10px;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:300;
    font-size:clamp(1rem, 1.8vw, 1.2rem);
    color:var(--ink);
  }
  .hero-scroll{
    position:absolute; bottom:28px; right:5vw;
    font-size:0.75rem; color:var(--ink-dim);
    writing-mode:vertical-rl;
    background:none; border:none; cursor:pointer;
    padding:10px;
    transition:color .2s ease;
  }
  .hero-scroll:hover, .hero-scroll:focus-visible{color:var(--accent);}

  @media (max-width:640px){
    .hero{
      padding:0 8vw 90px;
    }
    .hero-content{text-align:center; margin:0 auto;}
    .hero-content h1{white-space:normal;}
  }

  /* ---------- patchwork ---------- */
  .patchwork{
    padding:90px 5vw 40px;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    transition:opacity .45s ease;
  }
  .patchwork.fading{opacity:0;}
  .tile{
    position:relative;
    border:none; padding:0; margin:0; cursor:pointer;
    overflow:hidden;
    aspect-ratio:16/9;
    width:100%;
    background:#000;
  }

  .tile-imgwrap{position:absolute; inset:0; background:#000;}
  .tile-imgwrap img{
    position:absolute; inset:0;
    width:100%; height:100%; object-fit:cover;
    opacity:0;
    transition:opacity 1s ease;
    filter:grayscale(0.1) brightness(0.92);
  }
  .tile-imgwrap img.is-active{opacity:1;}

  .tile-overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    background:rgba(15,13,11,0);
    opacity:0;
    transition:opacity .35s ease, background .35s ease;
    padding:12px;
  }
  .tile:hover .tile-overlay, .tile:focus-visible .tile-overlay{
    opacity:1;
    background:rgba(15,13,11,0.62);
  }
  .tile:hover .tile-imgwrap img.is-active{filter:grayscale(0) brightness(1);}
  .tile-overlay h3{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-size:clamp(0.95rem, 1.6vw, 1.3rem);
  }
  .tile-overlay p{
    margin-top:6px;
    font-style:italic;
    font-size:0.8rem;
    color:var(--ink-dim);
  }

  @media (max-width:820px){
    .patchwork{gap:6px; padding:80px 4vw 30px;}
  }
  @media (max-width:640px){
    .patchwork{grid-template-columns:1fr; gap:14px;}
    .tile{aspect-ratio:16/9;}
  }
  @media (max-width:480px){
    .patchwork{gap:12px;}
  }

  /* ---------- detail view ---------- */
  .detail{
    display:none;
    padding:88px 5vw 40px;
    opacity:0;
    transition:opacity .45s ease;
  }
  .detail.open{display:block;}
  .detail.visible{opacity:1;}
  .detail-close{
    display:block;
    background:none; border:none; color:var(--ink);
    font-size:1.3rem; cursor:pointer; padding:0;
    margin-bottom:28px;
    opacity:0.7; transition:opacity .2s ease;
  }
  .detail-close:hover{opacity:1;}

  .project-block{
    display:grid;
    grid-template-columns:minmax(220px, 300px) 1fr;
    gap:56px;
  }
  .project-meta h2{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-size:1.9rem;
    line-height:1.15;
    margin-bottom:8px;
  }
  .project-meta .type{
    font-style:italic;
    color:var(--ink-dim);
    font-size:0.9rem;
    margin-bottom:20px;
  }
  .project-meta .credit{
    font-size:0.88rem;
    color:var(--ink-dim);
    margin-bottom:6px;
  }
  .project-meta .credit strong{color:var(--ink); font-weight:500;}
  .project-meta .diffusion{
    margin-top:16px;
    font-size:0.8rem;
    color:var(--ink-dim);
    font-style:italic;
  }

  .stills{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
  }
  .stills button{
    border:none; padding:0; margin:0; background:#000; cursor:pointer;
    position:relative; overflow:hidden;
    aspect-ratio:16/9;
  }
  .stills img{
    width:100%; height:100%; object-fit:cover;
    transition:transform .5s ease, filter .5s ease;
    filter:grayscale(0.15) brightness(0.94);
  }
  .stills button:hover img{transform:scale(1.035); filter:grayscale(0) brightness(1);}
  .stills button::after{
    content:"";
    position:absolute; inset:0;
    border:1px solid rgba(237,231,218,0);
    transition:border-color .3s ease;
  }
  .stills button:hover::after{border-color:rgba(237,231,218,0.35);}

  @media (max-width:820px){
    .project-block{grid-template-columns:1fr; gap:24px;}
    .stills{grid-template-columns:repeat(2,1fr);}
    header{padding:18px 6vw;}
    nav{gap:18px;}
  }

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed; inset:0; z-index:100;
    background:rgba(10,9,8,0.97);
    display:flex;
    align-items:center; justify-content:center;
    flex-direction:column;
    padding:5vh 5vw;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .45s ease, visibility 0s linear .45s;
  }
  .lightbox.open{
    opacity:1; visibility:visible; pointer-events:auto;
    transition:opacity .45s ease, visibility 0s linear 0s;
  }
  .lightbox img{
    max-width:100%; max-height:76vh;
    object-fit:contain;
  }
  .lightbox .lb-caption{
    margin-top:20px; text-align:center;
    font-size:0.85rem; color:var(--ink-dim);
  }
  .lightbox .lb-caption strong{color:var(--ink); font-weight:500;}
  .lb-close, .lb-prev, .lb-next{
    position:absolute;
    background:none; border:none; color:var(--ink);
    font-family:'Inter', sans-serif; font-size:1.6rem;
    cursor:pointer; padding:14px;
    opacity:0.7; transition:opacity .2s ease;
  }
  .lb-close:hover, .lb-prev:hover, .lb-next:hover{opacity:1;}
  .lb-close{top:16px; right:20px; font-size:1.4rem;}
  .lb-prev{left:8px; top:50%; transform:translateY(-50%);}
  .lb-next{right:8px; top:50%; transform:translateY(-50%);}
  @media (max-width:820px){
    .lb-prev{left:0;} .lb-next{right:0;}
  }

  /* ---------- text modal (filmographie / bio) ---------- */
  .text-modal{
    position:fixed; inset:0; z-index:100;
    background:rgba(10,9,8,0.97);
    display:flex;
    align-items:flex-start; justify-content:center;
    padding:14vh 6vw 8vh;
    overflow-y:auto;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .45s ease, visibility 0s linear .45s;
  }
  .text-modal.open{
    opacity:1; visibility:visible; pointer-events:auto;
    transition:opacity .45s ease, visibility 0s linear 0s;
  }
  .text-modal-inner{
    max-width:720px; width:100%;
    text-align:center;
  }
  .text-modal-inner h2{
    font-family:'Fraunces', serif; font-weight:400;
    font-size:clamp(1.6rem, 3.4vw, 2.4rem);
    margin-bottom:34px;
  }
  .text-modal-inner .modal-body{
    text-align:left;
    font-size:0.92rem;
    color:var(--ink-dim);
    line-height:1.75;
  }
  .text-modal-inner .modal-body p{margin-bottom:18px;}
  #bioModal .modal-body p{text-align:justify; text-indent:2em;}
  .text-modal-inner .modal-body h3{
    font-family:'Fraunces', serif; font-weight:400; color:var(--ink);
    font-size:1.05rem; letter-spacing:0.03em;
    margin:30px 0 14px;
  }
  .text-modal-inner .modal-body h3:first-child{margin-top:0;}
  .text-modal-inner .modal-body ul{list-style:none;}
  .text-modal-inner .modal-body li{margin-bottom:16px;}
  .text-modal-inner .modal-body li strong{color:var(--ink); font-weight:500;}
  .text-modal-inner .modal-body li span{
    display:block; font-style:italic; font-size:0.85rem; margin-top:2px;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(12px);}
    to{opacity:1; transform:translateY(0);}
  }
  .text-modal-inner .modal-body p,
  .text-modal-inner .modal-body h3,
  .text-modal-inner .modal-body li{
    animation:fadeUp .6s ease both;
  }
  .modal-close{
    position:absolute; top:16px; right:20px;
    background:none; border:none; color:var(--ink);
    font-size:1.4rem; cursor:pointer; padding:14px;
    opacity:0.7; transition:opacity .2s ease;
  }
  .modal-close:hover{opacity:1;}

  /* ---------- footer ---------- */
  footer{
    padding:70px 5vw 50px;
    border-top:1px solid var(--line);
    display:flex; flex-wrap:wrap; justify-content:space-between; gap:24px;
    font-size:0.85rem; color:var(--ink-dim);
  }
  footer a{color:var(--ink);}
  footer a:hover{color:var(--accent);}
  footer .col{min-width:200px;}
  footer .col h3{
    font-family:'Fraunces', serif; font-size:1.1rem; color:var(--ink); font-weight:400; margin-bottom:10px;
  }
  footer{transition:padding .45s ease;}
  footer.compact{
    padding:30px 5vw 26px;
    gap:12px;
  }
  footer.compact .col h3{font-size:0.92rem; margin-bottom:4px;}
  footer.compact .col p{margin:0;}

  @media (max-width:640px){
    footer{
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:32px;
    }
    footer .col{min-width:0;}
  }

  :focus-visible{outline:1px solid var(--accent); outline-offset:2px;}
</style>
</head>

<div class="text-modal" id="filmoModal">

  </div>
</div>

<div class="text-modal" id="bioModal">

</div>

<footer id="contact">

  </div>

    <p><a href="https://www.imdb.com/name/nm7436555/" target="_blank" rel="noopener">IMDb</a></p>
  </div>
  <div class="col">
    <p>© Paul Olinger Ost</p>
  </div>
</footer>

const IMG_BASE = "https://static.wixstatic.com/media/";
const thumb = s => `${IMG_BASE}${s}/v1/fill/w_700,h_500,al_c,q_85/${s}`;
const full = s => `${IMG_BASE}${s}/v1/fill/w_1600,h_900,al_c,q_90/${s}`;

/* ---------- hero background slideshow ---------- */
const heroBg = document.getElementById('heroBg');
const heroImages = projects.map(p => full(p.stills[0]));
heroImages.forEach((src, i) => {
  const layer = document.createElement('div');
  layer.className = 'hero-bg-layer' + (i === 0 ? ' is-active' : '');
  layer.style.backgroundImage = `url('${src}')`;
  heroBg.appendChild(layer);
});
const heroLayers = heroBg.querySelectorAll('.hero-bg-layer');
let heroActive = 0;
if(heroLayers.length > 1){
  setInterval(() => {
    heroLayers[heroActive].classList.remove('is-active');
    heroActive = (heroActive + 1) % heroLayers.length;
    heroLayers[heroActive].classList.add('is-active');
  }, 5000);
}

/* ---------- patchwork grid ---------- */
const patchwork = document.getElementById('patchwork');

projects.forEach((p, i) => {
  const tile = document.createElement('button');
  tile.className = 'tile';
  tile.dataset.project = i;
  tile.innerHTML = `
    <div class="tile-imgwrap">
      <img src="${thumb(p.stills[0])}" loading="lazy" class="is-active" alt="">
    </div>
    <div class="tile-overlay">
      <h3 class="display">${p.title}</h3>
      <p>${p.type}</p>
    </div>
  `;
  patchwork.appendChild(tile);
});

/* ---------- detail view ---------- */
const detail = document.getElementById('detail');
const projectBlock = document.getElementById('projectBlock');

function openProject(i){
  const p = projects[i];
  projectBlock.innerHTML = `
    <div class="project-meta">
      <button class="detail-close" id="backBtn" aria-label="Fermer">✕</button>
      <h2 class="display">${p.title}</h2>
      <p class="type">${p.type}</p>
      <p class="credit">${p.credit}</p>
      <p class="credit"><strong>${p.prod}</strong></p>
      ${p.diffusion ? `<p class="diffusion">${p.diffusion}</p>` : ''}
    </div>
    <div class="stills">
      ${p.stills.map((s, si) => `
        <button data-project="${i}" data-index="${si}">
          <img src="${thumb(s)}" loading="lazy" alt="${p.title} — still ${si+1}">
        </button>
      `).join('')}
    </div>
  `;
  const heroEl = document.querySelector('.hero');
  heroEl.classList.add('fading');
  patchwork.classList.add('fading');
  document.getElementById('contact').classList.add('compact');
  setTimeout(() => {
    patchwork.style.display = 'none';
    heroEl.style.display = 'none';
    window.scrollTo({top:0, behavior:'instant'});
    detail.classList.add('open');
    requestAnimationFrame(() => detail.classList.add('visible'));
  }, 460);
}
function closeProject(){
  if(!detail.classList.contains('open')) return;
  detail.classList.remove('visible');
  setTimeout(() => {
    detail.classList.remove('open');
    patchwork.style.display = 'grid';
    document.querySelector('.hero').style.display = '';
    document.getElementById('contact').classList.remove('compact');
    requestAnimationFrame(() => {
      patchwork.classList.remove('fading');
      document.querySelector('.hero').classList.remove('fading');
    });
  }, 420);
}

patchwork.addEventListener('click', e => {
  const tile = e.target.closest('.tile');
  if(!tile) return;
  openProject(parseInt(tile.dataset.project));
});
projectBlock.addEventListener('click', e => {
  if(e.target.closest('#backBtn')) goHome();
});

function goHome(){
  closeProject();
  closeLightbox();
  closeFilmo();
  closeBio();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- lightbox ---------- */
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbCaption = document.getElementById('lbCaption');
let currentProject = 0, currentIndex = 0;

function openLightbox(pIdx, sIdx){
  currentProject = pIdx; currentIndex = sIdx;
  renderLightbox();
  lightbox.classList.add('open');
}
function renderLightbox(){
  const p = projects[currentProject];
  const s = p.stills[currentIndex];
  lbImg.src = full(s);
  lbImg.alt = `${p.title} — still ${currentIndex+1}`;
  lbCaption.innerHTML = `<strong>${p.title}</strong> — ${p.credit}`;
}
function closeLightbox(){ lightbox.classList.remove('open'); }
function nextStill(){ currentIndex = (currentIndex+1) % projects[currentProject].stills.length; renderLightbox(); }
function prevStill(){ currentIndex = (currentIndex-1+projects[currentProject].stills.length) % projects[currentProject].stills.length; renderLightbox(); }

projectBlock.addEventListener('click', e => {
  const btn = e.target.closest('button[data-project]');
  if(!btn) return;
  openLightbox(parseInt(btn.dataset.project), parseInt(btn.dataset.index));
});

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbNext').addEventListener('click', nextStill);
document.getElementById('lbPrev').addEventListener('click', prevStill);
lightbox.addEventListener('click', e => { if(e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => {
  if(lightbox.classList.contains('open')){
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowRight') nextStill();
    if(e.key === 'ArrowLeft') prevStill();
  } else if(detail.classList.contains('open') && e.key === 'Escape'){
    closeProject();
  } else if(filmoModal.classList.contains('open') && e.key === 'Escape'){
    closeFilmo();
  } else if(bioModal.classList.contains('open') && e.key === 'Escape'){
    closeBio();
  }
});

/* ---------- bio modal ---------- */
const bioModal = document.getElementById('bioModal');
const bioBody = document.getElementById('bioBody');

bioBody.innerHTML = `
  <p>Originaire de Cornas, en Ardèche, j'ai manifesté très tôt un besoin d'expression artistique, passant du théâtre au conservatoire de musique où j'ai étudié le saxophone et le piano. Dès l'âge de 14 ans, je me suis tourné vers le cinéma en fondant une « Junior Association ». Véritable école de la débrouille, cette structure me permettait de financer mes propres courts-métrages grâce à des captations d'événements réalisées dans la région.</p>
  <p>Mon parcours scolaire a été plus atypique. Trois mois avant le bac, ma proviseure m'a convoqué pour me suggérer de redoubler mon année de terminale ou de me déscolariser afin de ne pas nuire aux statistiques de réussite, me lançant : « De toute façon, vous n'aurez jamais votre bac ». J'ai pris ma décision instantanément : j'ai quitté le lycée et je suis monté à Paris pour me consacrer entièrement à ma vocation. Ce fut le grand saut. Issu d'une famille étrangère au milieu artistique, je débarquais sans réseau, mais avec la certitude que ma place était là. C'est durant ces années que le métier de directeur de la photographie s'est définitivement imposé à moi.</p>
  <p>Mon expérience s'est forgée sur le tas. J'ai commencé par multiplier les films étudiants et les projets bénévoles, tout en travaillant parfois de nuit en mise en rayon pour tenir le coup financièrement. Petit à petit, ces expériences m'ont ouvert les portes de mes premiers tournages rémunérés : institutionnel, corporate et petites publicités. En parallèle, je continuais de signer l'image de fictions bénévoles pour construire ma première bande-démo, étape cruciale qui m'a permis de franchir un cap professionnel.</p>
  <p>En 2019, j'ai signé l'image de mon premier long-métrage, Fario, réalisé par Gérard Jumel, avec qui j'ai collaboré à nouveau en 2024 sur Sur le Sentier. Mon travail s'est depuis diversifié, allant de la comédie (Des Vacances à Tout Prix) au documentaire d'expédition dans la jungle camerounaise, en passant par la publicité pour de grandes maisons comme L'Oréal, Porsche ou Moët &amp; Chandon.</p>
  <p>L'année 2024 a été marquée par ma rencontre avec Marie-Claude Pietragalla et Julien Derouault. Cette collaboration artistique m'a conduit à la réalisation de la captation du ballet Giselle(s) pour Olympia TV (Canal+). Aujourd'hui, je continue d'explorer le lien entre image et mouvement en animant des masterclass au sein de leur compagnie, « Le Théâtre du Corps ».</p>
  <p>Animé par le défi technique et l'alchimie humaine, je considère mon métier comme un apprentissage permanent qui ne permet aucun repos sur ses acquis. Malgré un contexte économique difficile pour la culture, je reste un fervent défenseur d'un cinéma indépendant et inventif. Je suis convaincu que la solidarité artistique et le fait de se mettre corps et âme au service d'un projet sont les meilleures réponses pour surmonter les crises actuelles.</p>
`;
