<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul Olinger Ost — Directeur de la Photographie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121110;
    --bg-alt:#17150f;
    --ink:#EDE7DA;
    --ink-dim:#948C7E;
    --line: rgba(237,231,218,0.14);
    --accent:#A9784B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-weight:400;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  img{display:block; max-width:100%;}
  button{font-family:inherit;}

  .display{font-family:'Fraunces', serif; font-weight:400;}

  /* ---------- top bar ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 5vw;
    background:linear-gradient(to bottom, rgba(18,17,16,0.9), rgba(18,17,16,0));
  }
  header .name{
    font-size:0.85rem;
    letter-spacing:0.02em;
    background:none; border:none; padding:0; margin:0; cursor:pointer; color:inherit;
    font-family:'Fraunces', serif; font-weight:400;
    transition:color .2s ease;
  }
  header .name:hover, header .name:focus-visible{color:var(--accent);}
  .construction-badge{
    display:flex; align-items:center; gap:8px;
    font-size:0.7rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .construction-badge .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--accent);
    animation:dotPulse 2.4s ease-in-out infinite;
  }
  @keyframes dotPulse{
    0%,100%{opacity:0.35;}
    50%{opacity:1;}
  }
  nav{display:flex; gap:28px;}
  nav a, nav button{
    font-size:0.85rem;
    color:var(--ink-dim);
    background:none; border:none; cursor:pointer;
    border-bottom:1px solid transparent;
    padding-bottom:2px;
    letter-spacing:0.03em;
    transition:color .2s ease, border-color .2s ease;
  }
  nav a:hover, nav a:focus-visible, nav button:hover{color:var(--ink); border-color:var(--accent);}

  /* ---------- hero ---------- */
  .hero{
    height:clamp(460px, 68vw, 100vh);
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    position:relative;
    padding:0 5vw 64px;
    background:#000;
    transition:opacity .45s ease;
  }
  .hero.fading{opacity:0;}
  .hero-bg{
    position:absolute; inset:0;
    opacity:0.55;
    overflow:hidden;
  }
  .hero-video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    object-position:center 30%;
    background:#000;
  }
  .hero-scrim{
    position:absolute; inset:0;
    background:linear-gradient(to top, var(--bg) 4%, rgba(18,17,16,0.15) 55%, rgba(18,17,16,0.55) 100%);
  }
  .hero-content{position:relative; max-width:1100px;}
  .hero-content h1{
    font-size:clamp(2.2rem, 6.4vw, 5.4rem);
    line-height:1;
    font-weight:400;
    letter-spacing:-0.01em;
    white-space:nowrap;
  }
  .hero-content .role{
    margin-top:22px;
    font-size:clamp(0.95rem, 1.6vw, 1.1rem);
    color:var(--ink-dim);
    letter-spacing:0.01em;
  }
  .hero-content .role-travel{
    margin-top:10px;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:300;
    font-size:clamp(1rem, 1.8vw, 1.2rem);
    color:var(--ink);
  }

  @media (max-width:640px){
    .hero{
      padding:0 8vw 90px;
    }
    .hero-content{text-align:center; margin:0 auto;}
    .hero-content h1{white-space:normal;}
  }

  /* ---------- project list (page d'accueil) ---------- */
  .project-list{
    padding:90px 5vw 40px;
  }
  .project-row{
    padding:56px 0;
    border-bottom:1px solid var(--line);
  }
  .project-row:first-child{padding-top:0;}
  .project-row:last-child{border-bottom:none;}

  .project-block{
    display:grid;
    grid-template-columns:minmax(220px, 300px) 1fr;
    gap:56px;
  }
  .project-meta h2{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-size:1.9rem;
    line-height:1.15;
    margin-bottom:8px;
  }
  .project-meta .type{
    font-style:italic;
    color:var(--ink-dim);
    font-size:0.9rem;
    margin-bottom:20px;
  }
  .project-meta .credit{
    font-size:0.88rem;
    color:var(--ink-dim);
    margin-bottom:6px;
  }
  .project-meta .credit strong{color:var(--ink); font-weight:500;}
  .project-meta .diffusion{
    margin-top:16px;
    font-size:0.8rem;
    color:var(--ink-dim);
    font-style:italic;
  }

  .stills{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
  }
  .stills button{
    border:none; padding:0; margin:0; background:#000; cursor:pointer;
    position:relative; overflow:hidden;
    aspect-ratio:16/9;
  }
  .stills img{
    width:100%; height:100%; object-fit:cover;
    transition:transform .5s ease, filter .5s ease;
    filter:grayscale(0.15) brightness(0.94);
  }
  .stills button:hover img{transform:scale(1.035); filter:grayscale(0) brightness(1);}
  .stills button::after{
    content:"";
    position:absolute; inset:0;
    border:1px solid rgba(237,231,218,0);
    transition:border-color .3s ease;
  }
  .stills button:hover::after{border-color:rgba(237,231,218,0.35);}

  .stills-wrap{position:relative;}
  .stills-arrow{
    position:absolute; top:50%; translate:0 -50%;
    z-index:5;
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    background:none;
    border:none;
    color:var(--ink);
    font-size:1.4rem;
    line-height:1;
    cursor:pointer;
    opacity:0.55;
    text-shadow:0 1px 5px rgba(0,0,0,0.65);
    transition:opacity .25s ease, transform .2s ease;
  }
  .stills-wrap:hover .stills-arrow{opacity:0.9;}
  .stills-arrow:hover, .stills-arrow:focus-visible{opacity:1;}
  .stills-prev{left:-18px;}
  .stills-prev:hover{transform:translateX(-3px);}
  .stills-next{right:-18px;}
  .stills-next:hover{transform:translateX(3px);}
  @media (max-width:900px){
    .stills-prev{left:-6px;}
    .stills-next{right:-6px;}
  }

  @media (max-width:820px){
    .project-block{grid-template-columns:1fr; gap:24px;}
    .stills{grid-template-columns:repeat(2,1fr);}
    header{padding:18px 6vw;}
    nav{gap:18px;}
    .project-list{padding:80px 4vw 30px;}
    .project-row{padding:40px 0;}
  }
  @media (max-width:480px){
    .stills{grid-template-columns:1fr;}
  }

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed; inset:0; z-index:100;
    background:rgba(10,9,8,0.97);
    display:flex;
    align-items:center; justify-content:center;
    flex-direction:column;
    padding:5vh 5vw;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .45s ease, visibility 0s linear .45s;
  }
  .lightbox.open{
    opacity:1; visibility:visible; pointer-events:auto;
    transition:opacity .45s ease, visibility 0s linear 0s;
  }
  .lightbox img{
    max-width:100%; max-height:76vh;
    object-fit:contain;
  }
  .lightbox .lb-caption{
    margin-top:20px; text-align:center;
    font-size:0.85rem; color:var(--ink-dim);
  }
  .lightbox .lb-caption strong{color:var(--ink); font-weight:500;}
  .lb-close, .lb-prev, .lb-next{
    position:absolute;
    background:none; border:none; color:var(--ink);
    font-family:'Inter', sans-serif; font-size:1.6rem;
    cursor:pointer; padding:14px;
    opacity:0.7; transition:opacity .2s ease;
  }
  .lb-close:hover, .lb-prev:hover, .lb-next:hover{opacity:1;}
  .lb-close{top:16px; right:20px; font-size:1.4rem;}
  .lb-prev{left:8px; top:50%; transform:translateY(-50%);}
  .lb-next{right:8px; top:50%; transform:translateY(-50%);}
  @media (max-width:820px){
    .lb-prev{left:0;} .lb-next{right:0;}
  }

  /* ---------- text modal (filmographie / pics / bio) ---------- */
  .text-modal{
    position:fixed; inset:0; z-index:100;
    background:rgba(10,9,8,0.97);
    display:flex;
    align-items:flex-start; justify-content:center;
    padding:14vh 6vw 8vh;
    overflow-y:auto;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .45s ease, visibility 0s linear .45s;
  }
  .text-modal.open{
    opacity:1; visibility:visible; pointer-events:auto;
    transition:opacity .45s ease, visibility 0s linear 0s;
  }
  .text-modal-inner{
    max-width:720px; width:100%;
    text-align:center;
  }
  .text-modal-inner h2{
    font-family:'Fraunces', serif; font-weight:400;
    font-size:clamp(1.6rem, 3.4vw, 2.4rem);
    margin-bottom:34px;
  }
  .text-modal-inner .modal-body{
    text-align:left;
    font-size:0.92rem;
    color:var(--ink-dim);
    line-height:1.75;
  }
  .text-modal-inner .modal-body p{margin-bottom:18px;}
  #bioModal .modal-body p{text-align:justify; text-indent:2em;}
  .text-modal-inner .modal-body h3{
    font-family:'Fraunces', serif; font-weight:400; color:var(--ink);
    font-size:1.05rem; letter-spacing:0.03em;
    margin:30px 0 14px;
  }
  .text-modal-inner .modal-body h3:first-child{margin-top:0;}
  .text-modal-inner .modal-body ul{list-style:none;}
  .text-modal-inner .modal-body li{margin-bottom:16px;}
  .text-modal-inner .modal-body li strong{color:var(--ink); font-weight:500;}
  .text-modal-inner .modal-body li span{
    display:block; font-style:italic; font-size:0.85rem; margin-top:2px;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(12px);}
    to{opacity:1; transform:translateY(0);}
  }
  .text-modal-inner .modal-body p,
  .text-modal-inner .modal-body h3,
  .text-modal-inner .modal-body li{
    animation:fadeUp .6s ease both;
  }
  .modal-close{
    position:absolute; top:16px; right:20px;
    background:none; border:none; color:var(--ink);
    font-size:1.4rem; cursor:pointer; padding:14px;
    opacity:0.7; transition:opacity .2s ease;
  }
  .modal-close:hover{opacity:1;}

  #bioModal .modal-body .bio-lang-note{
    text-align:center; text-indent:0;
    font-size:0.78rem; font-style:italic;
    color:var(--ink-dim);
    margin-bottom:30px;
  }
  #bioModal .modal-body .bio-lang-note a{
    color:var(--accent);
    border-bottom:1px solid transparent;
    transition:border-color .2s ease;
  }
  #bioModal .modal-body .bio-lang-note a:hover{border-color:var(--accent);}
  .bio-divider{
    border:none; border-top:1px solid var(--line);
    margin:44px 0 8px;
  }

  /* ---------- bio photo ---------- */
  .bio-photo-wrap{
    margin-top:44px;
    display:flex;
    justify-content:center;
  }
  .bio-photo{
    width:320px;
    aspect-ratio:4/5;
    object-fit:cover;
    border:1px solid var(--line);
    filter:grayscale(0.15) brightness(0.95);
  }
  @media (max-width:640px){
    .bio-photo{width:240px;}
  }

  /* ---------- pics page ---------- */
  #picsModal .text-modal-inner{max-width:1100px;}
  .pics-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    text-align:left;
  }
  .pics-tile{
    position:relative;
    overflow:hidden;
    aspect-ratio:4/5;
    background:var(--bg-alt);
  }
  .pics-tile img{
    width:100%; height:100%; object-fit:cover;
    filter:grayscale(0.1) brightness(0.92);
    transition:filter .4s ease, transform .5s ease;
  }
  .pics-tile:hover img{filter:grayscale(0) brightness(1); transform:scale(1.03);}
  .pics-placeholder{
    aspect-ratio:4/5;
    border:1px dashed var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-dim);
    font-size:1.4rem;
    font-family:'Fraunces', serif;
  }
  @media (max-width:640px){
    .pics-grid{grid-template-columns:repeat(2, 1fr);}
  }

  /* ---------- footer ---------- */
  footer{
    padding:70px 5vw 50px;
    border-top:1px solid var(--line);
    display:flex; flex-wrap:wrap; justify-content:space-between; gap:24px;
    font-size:0.85rem; color:var(--ink-dim);
  }
  footer a{color:var(--ink);}
  footer a:hover{color:var(--accent);}
  footer .col{min-width:200px;}
  footer .col h3{
    font-family:'Fraunces', serif; font-size:1.1rem; color:var(--ink); font-weight:400; margin-bottom:10px;
  }

  @media (max-width:640px){
    footer{
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:32px;
    }
    footer .col{min-width:0;}
  }

  :focus-visible{outline:1px solid var(--accent); outline-offset:2px;}
</style>
</head>

</footer>

const IMG_BASE = "https://static.wixstatic.com/media/";
// Force le format WebP sur les images servies par Wix (le format est déterminé
// par l'extension du dernier segment de l'URL) afin d'alléger le chargement.
const webpName = s => s.replace(/\.(jpg|jpeg|png)$/i, '.webp');
const thumb = s => `${IMG_BASE}${s}/v1/fill/w_700,h_500,al_c,q_85/${webpName(s)}`;
const full  = s => `${IMG_BASE}${s}/v1/fill/w_1600,h_900,al_c,q_90/${webpName(s)}`;

/* ---------- hero video ---------- */
// Poster affiché tant que la vidéo n'est pas chargée (première still du premier projet)
document.getElementById('heroVideo').poster = full(projects[0].stills[0]);

/* ---------- liste des projets (page d'accueil) ---------- */
const projectList = document.getElementById('projectList');

// Décalage courant (fenêtre de 3 stills affichées) pour chaque projet
const stillsOffset = projects.map(() => 0);

function stillsMarkup(p, i){
  const n = p.stills.length;
  const off = stillsOffset[i];
  return [0, 1, 2].map(k => {
    const realIndex = (off + k) % n;
    const s = p.stills[realIndex];
    return `
      <button data-project="${i}" data-index="${realIndex}">
        <img src="${thumb(s)}" loading="lazy" alt="${p.title} — still ${realIndex+1}">
      </button>
    `;
  }).join('');
}

function renderStills(i){
  const p = projects[i];
  const container = projectList.querySelector(`.stills[data-project-stills="${i}"]`);
  container.innerHTML = stillsMarkup(p, i);
}

function shiftStills(i, dir){
  const n = projects[i].stills.length;
  stillsOffset[i] = (stillsOffset[i] + dir + n) % n;
  renderStills(i);
}

projects.forEach((p, i) => {
  const row = document.createElement('div');
  row.className = 'project-row';
  const showArrows = p.stills.length > 3;
  row.innerHTML = `
    <div class="project-block">
      <div class="project-meta">
        <h2 class="display">${p.title}</h2>
        <p class="type">${p.type}</p>
        <p class="credit">${p.credit}</p>
        <p class="credit"><strong>${p.prod}</strong></p>
        ${p.diffusion ? `<p class="diffusion">${p.diffusion}</p>` : ''}
      </div>
      <div class="stills-wrap">
        ${showArrows ? `<button class="stills-arrow stills-prev" data-shift="-1" data-shift-project="${i}" aria-label="Photos précédentes">‹</button>` : ''}
        <div class="stills" data-project-stills="${i}">
          ${stillsMarkup(p, i)}
        </div>
        ${showArrows ? `<button class="stills-arrow stills-next" data-shift="1" data-shift-project="${i}" aria-label="Photos suivantes">›</button>` : ''}
      </div>
    </div>
  `;
  projectList.appendChild(row);
});

projectList.addEventListener('click', e => {
  const arrow = e.target.closest('button[data-shift-project]');
  if(arrow){
    shiftStills(parseInt(arrow.dataset.shiftProject), parseInt(arrow.dataset.shift));
    return;
  }
  const btn = e.target.closest('button[data-project]');
  if(!btn) return;
  openLightbox(parseInt(btn.dataset.project), parseInt(btn.dataset.index));
});

/* ---------- défilement 2 doigts (trackpad) sur les stills ---------- */
let stillsWheelLocked = false;
projectList.addEventListener('wheel', e => {
  const wrap = e.target.closest('.stills-wrap');
  if(!wrap) return;
  // Un scroll vertical classique de la page doit rester intact
  if(Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;

  const stillsEl = wrap.querySelector('.stills');
  const i = parseInt(stillsEl.dataset.projectStills, 10);
  if(projects[i].stills.length <= 3) return; // pas assez de photos pour glisser

  e.preventDefault();
  if(stillsWheelLocked || Math.abs(e.deltaX) < 12) return;
  stillsWheelLocked = true;
  shiftStills(i, e.deltaX > 0 ? 1 : -1);
  setTimeout(() => { stillsWheelLocked = false; }, 380);
}, { passive:false });

/* ---------- lightbox ---------- */
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbCaption = document.getElementById('lbCaption');
let currentProject = 0, currentIndex = 0;

/* Empêche le fond de scroller en même temps qu'une fenêtre superposée */
function lockPageScroll(){ document.body.style.overflow = 'hidden'; }
function unlockPageScroll(){ document.body.style.overflow = ''; }

function openLightbox(pIdx, sIdx){
  currentProject = pIdx; currentIndex = sIdx;
  renderLightbox();
  lightbox.classList.add('open');
  lockPageScroll();
}
function renderLightbox(){
  const p = projects[currentProject];
  const s = p.stills[currentIndex];
  lbImg.src = full(s);
  lbImg.alt = `${p.title} — still ${currentIndex+1}`;
  lbCaption.innerHTML = `<strong>${p.title}</strong> — ${p.credit}`;
}
function closeLightbox(){ lightbox.classList.remove('open'); unlockPageScroll(); }
function nextStill(){ currentIndex = (currentIndex+1) % projects[currentProject].stills.length; renderLightbox(); }
function prevStill(){ currentIndex = (currentIndex-1+projects[currentProject].stills.length) % projects[currentProject].stills.length; renderLightbox(); }

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbNext').addEventListener('click', nextStill);
document.getElementById('lbPrev').addEventListener('click', prevStill);
lightbox.addEventListener('click', e => { if(e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => {
  if(lightbox.classList.contains('open')){
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowRight') nextStill();
    if(e.key === 'ArrowLeft') prevStill();
  } else if(filmoModal.classList.contains('open') && e.key === 'Escape'){
    closeFilmo();
  } else if(picsModal.classList.contains('open') && e.key === 'Escape'){
    closePics();
  } else if(bioModal.classList.contains('open') && e.key === 'Escape'){
    closeBio();
  }
});

/* ---------- bio modal ---------- */
const bioModal = document.getElementById('bioModal');
const bioBody = document.getElementById('bioBody');

bioBody.innerHTML = `
  <p class="bio-lang-note"><a href="#bioEnglish">English version below ↓</a></p>
  <p>Originaire de Cornas, en Ardèche, j'ai manifesté très tôt un besoin d'expression artistique, passant du théâtre au conservatoire de musique où j'ai étudié le saxophone et le piano. Dès l'âge de 14 ans, je me suis tourné vers le cinéma en fondant une « Junior Association ». Véritable école de la débrouille, cette structure me permettait de financer mes propres courts-métrages grâce à des captations d'événements réalisées dans la région.</p>
  <p>Mon parcours scolaire a été plus atypique. Trois mois avant le bac, ma proviseure m'a convoqué pour me suggérer de redoubler mon année de terminale ou de me déscolariser afin de ne pas nuire aux statistiques de réussite, me lançant : « De toute façon, vous n'aurez jamais votre bac ». J'ai pris ma décision instantanément : j'ai quitté le lycée et je suis monté à Paris pour me consacrer entièrement à ma vocation. Ce fut le grand saut. Issu d'une famille étrangère au milieu artistique, je débarquais sans réseau, mais avec la certitude que ma place était là. C'est durant ces années que le métier de directeur de la photographie s'est définitivement imposé à moi.</p>
  <p>Mon expérience s'est forgée sur le tas. J'ai commencé par multiplier les films étudiants et les projets bénévoles, tout en travaillant parfois de nuit en mise en rayon pour tenir le coup financièrement. Petit à petit, ces expériences m'ont ouvert les portes de mes premiers tournages rémunérés : institutionnel, corporate et petites publicités. En parallèle, je continuais de signer l'image de fictions bénévoles pour construire ma première bande-démo, étape cruciale qui m'a permis de franchir un cap professionnel.</p>
  <p>En 2019, j'ai signé l'image de mon premier long-métrage, Fario, réalisé par Gérard Jumel, avec qui j'ai collaboré à nouveau en 2024 sur Sur le Sentier. Mon travail s'est depuis diversifié, allant de la comédie (Des Vacances à Tout Prix) au documentaire d'expédition dans la jungle camerounaise, en passant par la publicité pour de grandes maisons comme L'Oréal, Porsche ou Moët &amp; Chandon.</p>
  <p>L'année 2024 a été marquée par ma rencontre avec Marie-Claude Pietragalla et Julien Derouault. Cette collaboration artistique m'a conduit à la réalisation de la captation du ballet Giselle(s) pour Olympia TV (Canal+). Aujourd'hui, je continue d'explorer le lien entre image et mouvement en animant des masterclass au sein de leur compagnie, « Le Théâtre du Corps ».</p>
  <p>Animé par le défi technique et l'alchimie humaine, je considère mon métier comme un apprentissage permanent qui ne permet aucun repos sur ses acquis. Malgré un contexte économique difficile pour la culture, je reste un fervent défenseur d'un cinéma indépendant et inventif. Je suis convaincu que la solidarité artistique et le fait de se mettre corps et âme au service d'un projet sont les meilleures réponses pour surmonter les crises actuelles.</p>

  <hr class="bio-divider" id="bioEnglish">
  <h3>English</h3>
  <p>Born in Cornas, in the Ardèche region, I felt the pull toward artistic expression early on — moving from theatre to the music conservatory, where I studied saxophone and piano. At 14, I turned to filmmaking and founded a "Junior Association." A real school of resourcefulness, it let me fund my own short films by shooting local events.</p>
  <p>My schooling took a more unusual path. Three months before my final exams, my headmistress called me in to suggest I repeat the year or leave school altogether, so as not to hurt the school's pass-rate statistics — telling me, "You'll never get your diploma anyway." I made up my mind on the spot: I left school and moved to Paris to devote myself entirely to my calling. It was a leap into the unknown. Coming from a family with no ties to the arts, I arrived with no network, but with the certainty that this was where I belonged. It was during these years that cinematography established itself, once and for all, as my path.</p>
  <p>My experience was forged on set. I started out on countless student films and volunteer projects, sometimes working night shifts stocking shelves to make ends meet. Little by little, these experiences opened the door to my first paid jobs: institutional films, corporate work, and small commercials. At the same time, I kept shooting volunteer fiction projects to build my first showreel — a crucial step that let me turn professional.</p>
  <p>In 2019, I shot my first feature film, Fario, directed by Gérard Jumel, with whom I worked again in 2024 on Sur le Sentier. My work has since branched out — from comedy (Des Vacances à Tout Prix) to an expedition documentary in the Cameroonian jungle, as well as advertising for major houses such as L'Oréal, Porsche and Moët &amp; Chandon.</p>
  <p>2024 was marked by meeting Marie-Claude Pietragalla and Julien Derouault. That artistic collaboration led me to direct the filming of the ballet Giselle(s) for Olympia TV (Canal+). Today, I keep exploring the relationship between image and movement, teaching masterclasses within their company, "Le Théâtre du Corps."</p>
  <p>Driven by technical challenge and human chemistry, I see my craft as a constant learning process that never allows for resting on past achievements. Despite a difficult economic climate for culture, I remain a committed advocate for independent, inventive cinema. I'm convinced that artistic solidarity — throwing yourself body and soul into a project — is the best way through today's crises.</p>

  <div class="bio-photo-wrap">
    <img class="bio-photo" src="assets/paul-portrait.webp" alt="Paul Olinger Ost">
  </div>
`;
