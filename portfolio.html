<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul Olinger Ost — Directeur de la Photographie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121110;
    --bg-alt:#17150f;
    --ink:#EDE7DA;
    --ink-dim:#948C7E;
    --line: rgba(237,231,218,0.14);
    --accent:#A9784B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-weight:400;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  img{display:block; max-width:100%;}
  button{font-family:inherit;}

  .display{font-family:'Fraunces', serif; font-weight:400;}

  /* ---------- top bar ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 5vw;
    background:linear-gradient(to bottom, rgba(18,17,16,0.9), rgba(18,17,16,0));
  }
  header .name{
    font-size:0.85rem;
    letter-spacing:0.02em;
  }
  nav{display:flex; gap:28px;}
  nav a, nav button{
    font-size:0.85rem;
    color:var(--ink-dim);
    background:none; border:none; cursor:pointer;
    border-bottom:1px solid transparent;
    padding-bottom:2px;
    transition:color .2s ease, border-color .2s ease;
  }
  nav a:hover, nav a:focus-visible, nav button:hover{color:var(--ink); border-color:var(--accent);}

  /* ---------- hero ---------- */
  .hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    position:relative;
    padding:0 5vw 64px;
    background:#000;
  }
  .hero-bg{
    position:absolute; inset:0;
    background-image:url('https://static.wixstatic.com/media/143b4f_4f2c954065774c7989910106cc637a9a~mv2.jpg');
    background-size:cover;
    background-position:center 30%;
    opacity:0.55;
  }
  .hero-scrim{
    position:absolute; inset:0;
    background:linear-gradient(to top, var(--bg) 4%, rgba(18,17,16,0.15) 55%, rgba(18,17,16,0.55) 100%);
  }
  .hero-content{position:relative; max-width:1100px;}
  .hero-content h1{
    font-size:clamp(2.2rem, 6.4vw, 5.4rem);
    line-height:1;
    font-weight:400;
    letter-spacing:-0.01em;
    white-space:nowrap;
  }
  .hero-content .role{
    margin-top:22px;
    font-size:clamp(0.95rem, 1.6vw, 1.1rem);
    color:var(--ink-dim);
    letter-spacing:0.01em;
  }
  .hero-content .role-travel{
    margin-top:10px;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:300;
    font-size:clamp(1rem, 1.8vw, 1.2rem);
    color:var(--ink);
  }
  .hero-scroll{
    position:absolute; bottom:28px; right:5vw;
    font-size:0.75rem; color:var(--ink-dim);
    writing-mode:vertical-rl;
  }

  @media (max-width:640px){
    .hero-content h1{white-space:normal;}
  }

  /* ---------- patchwork ---------- */
  .patchwork{
    padding:90px 5vw 40px;
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    grid-auto-rows:16vw;
    gap:10px;
  }
  .tile{
    position:relative;
    border:none; padding:0; margin:0; cursor:pointer;
    overflow:hidden;
    grid-column:span 2;
    grid-row:span 1;
  }
  .tile.tile--wide{grid-column:span 3;}
  .tile.tile--tall{grid-row:span 2;}
  .tile.tile--narrow{grid-column:span 2;}

  .tile-imgwrap{position:absolute; inset:0;}
  .tile-imgwrap img{
    position:absolute; inset:0;
    width:100%; height:100%; object-fit:cover;
    opacity:0;
    transition:opacity 1s ease;
    filter:grayscale(0.1) brightness(0.92);
  }
  .tile-imgwrap img.is-active{opacity:1;}

  .tile-overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    background:rgba(15,13,11,0);
    opacity:0;
    transition:opacity .35s ease, background .35s ease;
    padding:12px;
  }
  .tile:hover .tile-overlay, .tile:focus-visible .tile-overlay{
    opacity:1;
    background:rgba(15,13,11,0.62);
  }
  .tile:hover .tile-imgwrap img.is-active{filter:grayscale(0) brightness(1);}
  .tile-overlay h3{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-size:clamp(0.95rem, 1.6vw, 1.3rem);
  }
  .tile-overlay p{
    margin-top:6px;
    font-style:italic;
    font-size:0.8rem;
    color:var(--ink-dim);
  }

  @media (max-width:820px){
    .patchwork{grid-template-columns:repeat(2,1fr); grid-auto-rows:42vw;}
    .tile, .tile.tile--wide, .tile.tile--narrow{grid-column:span 1;}
    .tile.tile--tall{grid-row:span 1;}
  }

  /* ---------- detail view ---------- */
  .detail{
    display:none;
    padding:110px 5vw 40px;
  }
  .detail.open{display:block;}
  .back-btn{
    background:none; border:none; color:var(--ink-dim); cursor:pointer;
    font-size:0.82rem; margin-bottom:40px;
    display:inline-flex; align-items:center; gap:8px;
    transition:color .2s ease;
  }
  .back-btn:hover{color:var(--ink);}

  .project-block{
    display:grid;
    grid-template-columns:minmax(220px, 300px) 1fr;
    gap:56px;
  }
  .project-meta h2{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-size:1.9rem;
    line-height:1.15;
    margin-bottom:8px;
  }
  .project-meta .type{
    font-style:italic;
    color:var(--ink-dim);
    font-size:0.9rem;
    margin-bottom:20px;
  }
  .project-meta .credit{
    font-size:0.88rem;
    color:var(--ink-dim);
    margin-bottom:6px;
  }
  .project-meta .credit strong{color:var(--ink); font-weight:500;}
  .project-meta .diffusion{
    margin-top:16px;
    font-size:0.8rem;
    color:var(--ink-dim);
    font-style:italic;
  }

  .stills{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:8px;
  }
  .stills button{
    grid-column:span 3;
    border:none; padding:0; margin:0; background:none; cursor:pointer;
    position:relative; overflow:hidden;
    aspect-ratio:16/9;
  }
  .stills button:nth-child(3n+1){grid-column:span 4;}
  .stills button:nth-child(3n+2){grid-column:span 2;}
  .stills img{
    width:100%; height:100%; object-fit:cover;
    transition:transform .5s ease, filter .5s ease;
    filter:grayscale(0.15) brightness(0.94);
  }
  .stills button:hover img{transform:scale(1.035); filter:grayscale(0) brightness(1);}
  .stills button::after{
    content:"";
    position:absolute; inset:0;
    border:1px solid rgba(237,231,218,0);
    transition:border-color .3s ease;
  }
  .stills button:hover::after{border-color:rgba(237,231,218,0.35);}

  @media (max-width:820px){
    .project-block{grid-template-columns:1fr; gap:24px;}
    .stills{grid-template-columns:repeat(2,1fr);}
    .stills button, .stills button:nth-child(3n+1), .stills button:nth-child(3n+2){grid-column:span 1;}
    header{padding:18px 6vw;}
    nav{gap:18px;}
  }

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed; inset:0; z-index:100;
    background:rgba(10,9,8,0.97);
    display:none;
    align-items:center; justify-content:center;
    flex-direction:column;
    padding:5vh 5vw;
  }
  .lightbox.open{display:flex;}
  .lightbox img{
    max-width:100%; max-height:76vh;
    object-fit:contain;
  }
  .lightbox .lb-caption{
    margin-top:20px; text-align:center;
    font-size:0.85rem; color:var(--ink-dim);
  }
  .lightbox .lb-caption strong{color:var(--ink); font-weight:500;}
  .lb-close, .lb-prev, .lb-next{
    position:absolute;
    background:none; border:none; color:var(--ink);
    font-family:'Inter', sans-serif; font-size:1.6rem;
    cursor:pointer; padding:14px;
    opacity:0.7; transition:opacity .2s ease;
  }
  .lb-close:hover, .lb-prev:hover, .lb-next:hover{opacity:1;}
  .lb-close{top:16px; right:20px; font-size:1.4rem;}
  .lb-prev{left:8px; top:50%; transform:translateY(-50%);}
  .lb-next{right:8px; top:50%; transform:translateY(-50%);}
  @media (max-width:820px){
    .lb-prev{left:0;} .lb-next{right:0;}
  }

  /* ---------- footer ---------- */
  footer{
    padding:70px 5vw 50px;
    border-top:1px solid var(--line);
    display:flex; flex-wrap:wrap; justify-content:space-between; gap:24px;
    font-size:0.85rem; color:var(--ink-dim);
  }
  footer a{color:var(--ink);}
  footer a:hover{color:var(--accent);}
  footer .col{min-width:200px;}
  footer .col h3{
    font-family:'Fraunces', serif; font-size:1.1rem; color:var(--ink); font-weight:400; margin-bottom:10px;
  }

  :focus-visible{outline:1px solid var(--accent); outline-offset:2px;}
</style>
</head>
<body>

<header>
  <div class="name display">Paul Olinger Ost</div>
  <nav>
    <button id="navFilms">Films</button>
    <a href="#bio">Bio</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-scrim"></div>
  <div class="hero-content">
    <h1 class="display">Paul Olinger Ost</h1>
    <p class="role">Directeur de la Photographie / Cinematographer</p>
    <p class="role-travel">Paris based but worldwild traveller</p>
  </div>
  <div class="hero-scroll">FILMOGRAPHIE ↓</div>
</section>

<main>
  <div class="patchwork" id="patchwork"></div>

  <section class="detail" id="detail">
    <button class="back-btn" id="backBtn">← Retour à l'ensemble</button>
    <div class="project-block" id="projectBlock"></div>
  </section>
</main>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Fermer">✕</button>
  <button class="lb-prev" id="lbPrev" aria-label="Précédent">←</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-next" id="lbNext" aria-label="Suivant">→</button>
  <p class="lb-caption" id="lbCaption"></p>
</div>

<footer id="contact">
  <div class="col">
    <h3 class="display">Contact</h3>
    <p><a href="mailto:contact@paulolinger.com">contact@paulolinger.com</a></p>
    <p>06.59.86.26.80</p>
    <p>Paris, France</p>
  </div>
  <div class="col">
    <h3 class="display">Suivre</h3>
    <p><a href="https://www.instagram.com/paulolingerost/" target="_blank" rel="noopener">Instagram</a></p>
    <p><a href="https://www.imdb.com/name/nm7436555/" target="_blank" rel="noopener">IMDb</a></p>
  </div>
  <div class="col">
    <p>© Paul Olinger Ost</p>
  </div>
</footer>

<script>
const projects = [

  {

    stills: [

    ]
  },
  {
    title: "FARIO",
    type: "long-métrage",
    credit: "réalisé par Gérard Jumel",
    prod: "Produit par Jour J Productions",
    diffusion: "Diffusion festivals + sortie salles indépendantes",
    stills: [
      "143b4f_3f2f55814ffe4f108eddc04588bc7000~mv2.png",
      "143b4f_52955a0e15a24dee8171feb7038d94b8~mv2.png",
      "143b4f_aa37b0237ea3428d8c2c3144af2e5d76~mv2.png",
      "143b4f_a0633a6f4b6043c597006294db0eb637~mv2.png",

    ]
  },
  {

    type: "court-métrage",
    credit: "écrit et réalisé par Bastien Louessard",
    prod: "Produit par Asmar Production x OMEN Films",
    stills: [
      "143b4f_74b04c17c25a4da299f331122c1856b4~mv2.png",
      "143b4f_060197c8afac459cb3251d8a2dfd9db5~mv2.png",

      "143b4f_3d8a3d69de3f4ef3a9cd2a250fa388d7~mv2.png",
      "143b4f_a6c8e53800524b25a0426637f67cfd95~mv2.png",

    ]
  },

    title: "Des Vacances à Tout Prix",
    type: "long-métrage",
    credit: "réalisé par Stevan Lee Mraovitch",
    prod: "Produit par Charlotte Russe Films avec le soutien du CNC",
    diffusion: "Diffusion festivals internationaux + streaming sur tubitv.com (U.S. seulement)",
    stills: [
      "143b4f_c8951d362fe14ad5bdf359df1c498e08~mv2.jpg",
      "143b4f_5a0f0e31c06043e7bff0c557603b39ce~mv2.jpg",
      "143b4f_fbd38ba835154010aaf95fea75f78e12~mv2.jpg",
      "143b4f_8d9fcdd0400846839b00940c9fde1b0c~mv2.jpg",

      "143b4f_dd119a26abba45f3a7c078f7ba7c5652~mv2.jpg"
    ]
  },
  {
    title: "OSEF Le Paradis",
    type: "court-métrage",
    credit: "réalisé par Quentin Dufournet-Charles",

    diffusion: "Diffusion télé + streaming sur Arté",
    stills: [
      "143b4f_179d6ca2b15c4ec28af3da4c0012090b~mv2.png",
      "143b4f_ea4188730c0649afbdf39098beca7703~mv2.png",
      "143b4f_9aaf8915b02a4c82be90073f37f49159~mv2.png",

    ]
  },
  {
    title: "Far Cry 5 — Shadow",
    type: "publicité",
    credit: "réalisé par Léo Wolfenstein",
    prod: "Produit par Cléo Productions",
    stills: [
      "143b4f_4ef1ddfe21f94b1cb0954bed5dd21fdb~mv2.png",

      "143b4f_f57a83e960ac426185ca7f40850623f5~mv2.png",
      "143b4f_4e358e4d39fa4cd58704c89272f45b2e~mv2.png",
      "143b4f_f17dd838c73743b58848698e8eb98998~mv2.png"
    ]
  },
  {
    title: "Rose d'Hiver",
    type: "court-métrage",
    credit: "écrit et réalisé par Alexis Rousseau",
    prod: "Produit par OMEN Films",
    stills: [
      "143b4f_0aa27c3d238f475bae0103d24c672bf1~mv2.png",
      "143b4f_157890f3923b4c00b20affd18b801819~mv2.png",
      "143b4f_2be179bbeec5453b96a614c0fed7eaba~mv2.png",
      "143b4f_2c6edad2c65e4858b5c78695aa6f5b1e~mv2.png",
      "143b4f_398b34c295e443a7b46de453eb593988~mv2.png",
      "143b4f_64de4efa749f4d3f960c4edf097aed07~mv2.png"
    ]
  }
];

const IMG_BASE = "https://static.wixstatic.com/media/";
const thumb = s => `${IMG_BASE}${s}/v1/fill/w_700,h_500,al_c,q_85/${s}`;
const full = s => `${IMG_BASE}${s}/v1/fill/w_1600,h_900,al_c,q_90/${s}`;

/* ---------- patchwork grid ---------- */
const patchwork = document.getElementById('patchwork');
const tileShapes = ['tile--wide','','','tile--tall','','tile--wide','','tile--tall'];

projects.forEach((p, i) => {
  const tile = document.createElement('button');
  tile.className = `tile ${tileShapes[i % tileShapes.length]}`;
  tile.dataset.project = i;
  tile.innerHTML = `
    <div class="tile-imgwrap">
      ${p.stills.map((s, si) => `<img src="${thumb(s)}" loading="lazy" class="${si===0 ? 'is-active' : ''}" alt="">`).join('')}
    </div>
    <div class="tile-overlay">
      <h3 class="display">${p.title}</h3>
      <p>${p.type}</p>
    </div>
  `;
  patchwork.appendChild(tile);

  // cinemagraph-style crossfade cycle
  const imgs = tile.querySelectorAll('.tile-imgwrap img');
  let active = 0;
  setInterval(() => {
    imgs[active].classList.remove('is-active');
    active = (active + 1) % imgs.length;
    imgs[active].classList.add('is-active');
  }, 1600 + i * 130); // slight offset per tile so they don't pulse in sync
});

/* ---------- detail view ---------- */
const detail = document.getElementById('detail');
const projectBlock = document.getElementById('projectBlock');

function openProject(i){
  const p = projects[i];
  projectBlock.innerHTML = `
    <div class="project-meta">
      <h2 class="display">${p.title}</h2>
      <p class="type">${p.type}</p>
      <p class="credit">${p.credit}</p>
      <p class="credit"><strong>${p.prod}</strong></p>
      ${p.diffusion ? `<p class="diffusion">${p.diffusion}</p>` : ''}
    </div>
    <div class="stills">
      ${p.stills.map((s, si) => `
        <button data-project="${i}" data-index="${si}">
          <img src="${thumb(s)}" loading="lazy" alt="${p.title} — still ${si+1}">
        </button>
      `).join('')}
    </div>
  `;
  patchwork.style.display = 'none';
  detail.classList.add('open');
  window.scrollTo({top:0, behavior:'instant'});
}
function closeProject(){
  detail.classList.remove('open');
  patchwork.style.display = 'grid';
}

patchwork.addEventListener('click', e => {
  const tile = e.target.closest('.tile');
  if(!tile) return;
  openProject(parseInt(tile.dataset.project));
});
document.getElementById('backBtn').addEventListener('click', closeProject);
document.getElementById('navFilms').addEventListener('click', () => {
  closeProject();
  document.querySelector('.hero').scrollIntoView({behavior:'smooth', block:'end'});
});

/* ---------- lightbox ---------- */
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbCaption = document.getElementById('lbCaption');
let currentProject = 0, currentIndex = 0;

function openLightbox(pIdx, sIdx){
  currentProject = pIdx; currentIndex = sIdx;
  renderLightbox();
  lightbox.classList.add('open');
}
function renderLightbox(){
  const p = projects[currentProject];
  const s = p.stills[currentIndex];
  lbImg.src = full(s);
  lbImg.alt = `${p.title} — still ${currentIndex+1}`;
  lbCaption.innerHTML = `<strong>${p.title}</strong> — ${p.credit}`;
}
function closeLightbox(){ lightbox.classList.remove('open'); }
function nextStill(){ currentIndex = (currentIndex+1) % projects[currentProject].stills.length; renderLightbox(); }
function prevStill(){ currentIndex = (currentIndex-1+projects[currentProject].stills.length) % projects[currentProject].stills.length; renderLightbox(); }

projectBlock.addEventListener('click', e => {
  const btn = e.target.closest('button[data-project]');
  if(!btn) return;
  openLightbox(parseInt(btn.dataset.project), parseInt(btn.dataset.index));
});

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbNext').addEventListener('click', nextStill);
document.getElementById('lbPrev').addEventListener('click', prevStill);
lightbox.addEventListener('click', e => { if(e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => {
